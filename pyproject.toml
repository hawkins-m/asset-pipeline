[project]
name = "asset-pipeline"
version = "0.1.0"
description = "Local-first concept image -> reviewed references -> 3D asset pipeline (see PLAN.md)"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic>=2",
    "pillow",
    "numpy",
    "shapely>=2",
    "python-multipart",
    "pyyaml",
    "scipy",
    "comfy-sdk==0.5.0",
]

[project.optional-dependencies]
dev = ["pytest"]
# Paid backends (Gemini, Claude): off unless AP_ALLOW_PAID_APIS=1 for a run. Not needed for
# the local, open-weights pipeline.
paid = ["google-genai", "anthropic"]

[project.scripts]
ap = "asset_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["asset_pipeline*"]

[tool.setuptools.package-data]
asset_pipeline = ["ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["comfy: needs a live ComfyUI on the configured URL (skipped if unreachable)"]
