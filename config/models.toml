# Every model the pipeline loads: the one list `ap models`, `ap doctor`, Setup and the installer read.
# A new model goes here (and in the README's models and licenses table) before any code loads it;
# tests/test_registry.py fails otherwise. Files are pinned to a revision with their size and checksum
# (sha256 for LFS files, the git blob sha1 for small ones), read from the Hugging Face API.
#
# need:   required      on every install (the demo path)
#         local.model   required when [local] model (or fallback) names its `select` value
#         optional      only for one route (TRELLIS); off without it
#         experimental  not part of the default pipeline
# root:   comfyui   [comfyui] models_dir (your ComfyUI's models folder)
#         models    <storage>/models
#         hf_cache  <storage>/hf/hub (the Hugging Face cache layout; TRELLIS.2 loads these by repo id)
# gated:  false | "auto" (accept the license on the model page; granted at once) | "manual" (the owner reviews)
# vram_gb: free VRAM the feature needs while this model runs (0: counted with the feature's main model)

