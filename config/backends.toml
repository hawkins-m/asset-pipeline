# Defaults that fit any machine. Your own settings (storage folder, Blender, ComfyUI, Unreal,
# GPUs) go in the user config, ~/.config/terraformer/config.toml, written by `ap setup` or the
# app's Setup screen; environment variables win over both. No secrets here or there: API keys
# live in ~/.config/terraformer/secrets.toml (mode 0600) or the environment.

[paths]
# Storage root (venvs, models, projects, outputs): AP_ROOT > the user config's ap_root >
# ~/.local/share/terraformer. The orchestrator venv: AP_VENV > venv > the checkout's .venv >
# $AP_ROOT/envs/orchestrator.
venv = ""

[tools]
# Blender executable: env AP_BLENDER > the user config > "blender" on PATH.
blender = "blender"

[comfyui]
# The ComfyUI the pipeline uses (AP_COMFY_URL overrides).
url = "http://127.0.0.1:8188"
# Ports of other ComfyUI servers on this machine (never used, but their GPU counts as busy)
other_ports = []
# Your ComfyUI's models folder: where `ap models download` puts the ComfyUI models (AP_COMFY_MODELS)
models_dir = ""
timeout_s = 900
# How the pipeline talks to ComfyUI (AP_COMFY_BACKEND overrides):
#   sdk    the Comfy SDK (Comfy API v2) through comfy-api-proxy at sdk_url
#          (scripts/comfy_api_proxy.sh; AP_COMFY_SDK_URL overrides sdk_url)
#   httpx  ComfyUI's own HTTP API at url, no proxy
backend = "sdk"
sdk_url = "http://127.0.0.1:8190"

[comfyui.service]
# How `ap comfy start|stop|restart` and the app's Start ComfyUI button launch the server. It
# only launches and stops ComfyUI; its install and environment are never changed. The port is
# the one in url above ({port} and {url} are filled into launch; ~ is expanded). The default
# fits a plain ComfyUI checkout in ~/ComfyUI run with the Python on PATH; point launch at your
# own launcher (a venv's python, a run script) in the user config (ap setup).
launch = "python main.py --listen 127.0.0.1 --port {port}"
cwd = "~/ComfyUI"
# GPU index to pin it to (HIP_VISIBLE_DEVICES on AMD, CUDA_VISIBLE_DEVICES on NVIDIA); "" = all
gpu = ""
start_timeout_s = 300
stop_timeout_s = 30
# The sdk backend also needs comfy-api-proxy at sdk_url: start brings it up after ComfyUI
# answers and stop takes it down (scripts/comfy_api_proxy.sh install, once).

[comfyui.workflows]
# Logical name -> workflows/<file>.json (+ <file>.bindings.json)
t2i = "flux_t2i"
t2i_anchor = "flux_t2i_anchor"   # + Flux Redux style anchor and optional style LoRA
segment = "sam3_detect"          # SAM 3.1 text-prompted masks (one image per object)
control_union = "flux_control_union"  # + depth/canny ControlNet Union Pro 2.0 (world mode frames)
depth_lora = "flux_depth_lora"        # + BFL FLUX.1-Depth-dev LoRA (A/B against the union)
img2img = "flux_img2img"              # low-denoise pass over a frame (+ Redux anchor), no control

# Paid backends (Gemini, Claude) refuse to run unless AP_ALLOW_PAID_APIS=1 is set for
# the run. Model ids confirmed 2026-10-05.
[gemini]
image_model = "gemini-3.1-flash-image-preview"
vision_model = "gemini-3.1-pro-preview"

[claude]
vision_model = "claude-opus-5-5"
effort = "high"

[local]
# Local vision LLM on the vision GPU ([jobs] gpu0_gpu), managed by asset_pipeline/vlm.py (`ap vlm`, or started on
# demand by stage 1). Never runs alongside TRELLIS: `trellis` stops it first. Free.
# Default 32B (A/B 2026-10-05: much better plans and boxes); 8B if the 32B can't start.
model = "32b"
fallback = "8b"
idle_unload_s = 600          # free the GPU after this long without requests

[local.models.32b]           # Qwen3-VL-32B-Instruct Q5_K_M, llama.cpp Vulkan, ~27 GB
backend = "llamacpp"
url = "http://127.0.0.1:8711"
gguf = "gguf/Qwen3-VL-32B-Instruct-GGUF/Qwen3-VL-32B-Instruct-Q5_K_M.gguf"   # under $AP_ROOT/models
mmproj = "gguf/Qwen3-VL-32B-Instruct-GGUF/mmproj-F16.gguf"
ctx = 8192
vram_gb = 28                 # free VRAM a job needs before it loads this model (jobs queue)

[local.models.8b]            # Qwen3-VL-8B-Instruct bf16, transformers (scripts/vlm_server.py), ~18 GB
backend = "transformers"
url = "http://127.0.0.1:8710"
vram_gb = 19

# The UI's job lanes (asset_pipeline/jobs.py, gpu_policy.py; RUNBOOK.md "What runs where").
# GPU lanes run one job at a time; CPU jobs (Blender, planning, export, Unreal commandlets) up
# to cpu_slots at once (jobs writing the same files still wait for each other).
[jobs]
cpu_slots = 2
# GPU assignment (AP_GPU_VISION, AP_GPU_COMFY override). With one GPU set both to 0: the lanes
# then wait for each other through the VRAM check.
gpu0_gpu = 0                 # the "GPU 0" lane: TRELLIS and the local vision model
comfy_gpu = 1                # ComfyUI's GPU when [comfyui.service] gpu is ""
vram_poll_s = 3

# Free VRAM a job needs before it starts (GB). ComfyUI's own memory counts as free for
# ComfyUI jobs; the vision model's need is its model's vram_gb above.
[jobs.vram_gb]
gpu = 16                     # TRELLIS.2 1024_cascade peaks at ~9 GB allocated
comfy = 12

# Default image backend per stage for new projects; override per project in project.json.
[defaults.backends]
style = "comfyui"
references = "comfyui"
frames = "comfyui"

[defaults]
llm = "local"      # local | gemini | claude

# Unreal Engine (world mode delivery). Editor Python runs headless through this binary's
# pythonscript commandlet (-nullrhi: no GPU). Optional: without it the Unreal tab explains
# and the rest works. Set it in Setup, or AP_UE_EDITOR_CMD
# (<UnrealEngine>/Engine/Binaries/Linux/UnrealEditor-Cmd).
[unreal]
editor_cmd = ""
# Active UE projects (<projects_dir>/<slug>/), and where `ap ue backup` snapshots them. Keep
# them on different physical drives. Overrides: AP_UE_PROJECTS, AP_UE_BACKUPS.
# "" = the defaults: ~/Documents/Unreal Projects and $AP_ROOT/backups/unreal.
projects_dir = ""
backup_dir = ""
backup_keep = 10

# Model choices the manifest (config/models.toml) allows: a mirror with the same files instead of a
# gated repo (AP_DINOV3_REPO overrides).
[models]
dinov3_repo = ""
