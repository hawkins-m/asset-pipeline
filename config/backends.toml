# Backend configuration. No secrets here: API keys come from the environment
# (GEMINI_API_KEY, ANTHROPIC_API_KEY).

[comfyui]
# Main ComfyUI instance (run_comfy.sh). Both ComfyUI instances run on GPU 1.
url = "http://127.0.0.1:8188"
timeout_s = 900

[comfyui.workflows]
# Logical name -> workflows/<file>.json (+ <file>.bindings.json)
t2i = "flux_t2i"
t2i_anchor = "flux_t2i_anchor"   # + Flux Redux style anchor and optional style LoRA
segment = "sam3_detect"          # SAM 3.1 text-prompted masks (one image per object)
control_union = "flux_control_union"  # + depth/canny ControlNet Union Pro 2.0 (world mode frames)
depth_lora = "flux_depth_lora"        # + BFL FLUX.1-Depth-dev LoRA (A/B against the union)

# Paid backends (Gemini, Claude) refuse to run unless AP_ALLOW_PAID_APIS=1 is set for
# the run. Model ids confirmed 2026-10-05.
[gemini]
image_model = "gemini-3.1-flash-image-preview"
vision_model = "gemini-3.1-pro-preview"

[claude]
vision_model = "claude-opus-5-5"
effort = "high"

[local]
# Local vision LLM on GPU 0, managed by asset_pipeline/vlm.py (`ap vlm`, or started on
# demand by stage 1). Never runs alongside TRELLIS: `trellis` stops it first. Free.
# Default 32B (A/B 2026-10-05: much better plans and boxes); 8B if the 32B can't start.
model = "32b"
fallback = "8b"
idle_unload_s = 600          # free the GPU after this long without requests

[local.models.32b]           # Qwen3-VL-32B-Instruct Q5_K_M, llama.cpp Vulkan, ~27 GB
backend = "llamacpp"
url = "http://127.0.0.1:8711"
gguf = "gguf/Qwen3-VL-32B-Instruct-GGUF/Qwen3-VL-32B-Instruct-Q5_K_M.gguf"   # under $AP_ROOT/models
mmproj = "gguf/Qwen3-VL-32B-Instruct-GGUF/mmproj-F16.gguf"
ctx = 8192

[local.models.8b]            # Qwen3-VL-8B-Instruct bf16, transformers (scripts/vlm_server.py), ~18 GB
backend = "transformers"
url = "http://127.0.0.1:8710"

# Default image backend per stage for new projects; override per project in project.json.
[defaults.backends]
style = "comfyui"
references = "comfyui"
frames = "comfyui"

[defaults]
llm = "local"      # local | gemini | claude

# Unreal Engine (world mode delivery). Editor Python runs headless through this binary's
# pythonscript commandlet (-nullrhi: no GPU). Override with AP_UE_EDITOR_CMD.
[unreal]
editor_cmd = "/mnt/storage/UnrealEngine/5.8.3/Engine/Binaries/Linux/UnrealEditor-Cmd"
# Active UE projects (<projects_dir>/<slug>/), and where `ap ue backup` snapshots them. Keep
# them on different physical drives. Overrides: AP_UE_PROJECTS, AP_UE_BACKUPS.
projects_dir = "~/Projects/Unreal"
backup_dir = "/mnt/storage/backups/unreal"
backup_keep = 10
